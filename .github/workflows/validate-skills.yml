name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate every public skill
        shell: bash
        run: |
          set -euo pipefail
          for skill_dir in skills/*; do
            [[ -d "$skill_dir" ]] || continue
            tools/validate-skill.sh "$skill_dir"
          done
      - name: Validate provenance and license policy
        run: python3 tools/validate-provenance.py
      - name: Validate repository isolation
        run: python3 skills/lls-skill-lifecycle-manager/scripts/audit-repository.py --repository . --role public
      - name: Validate WorkBuddy install contract
        run: python3 tools/validate-workbuddy-install.py
      - name: Test self-contained packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/public-skills.tsv
          import json
          for item in json.load(open("registry.json", encoding="utf-8"))["skills"]:
              print(f"{item['name']}\t{item['version']}")
          PY
          while IFS=$'\t' read -r slug version; do
            tools/package-skill.sh "$slug" "$version" "$RUNNER_TEMP/packages"
          done < /tmp/public-skills.tsv
      - name: Run skill unit tests
        shell: bash
        run: |
          set -euo pipefail
          for tests_dir in skills/*/tests; do
            if [[ -d "$tests_dir" ]]; then
              python3 -m unittest discover -s "$tests_dir" -p 'test_*.py'
            fi
          done
