name: Package and release one skill

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Skill directory name under skills/
        required: true
        type: string
      version:
        description: Semantic version without the v prefix
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate requested skill
        shell: bash
        run: |
          set -euo pipefail
          slug='${{ inputs.slug }}'
          version='${{ inputs.version }}'
          [[ "$slug" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tools/validate-skill.sh "skills/$slug"
      - name: Build reproducible ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          slug='${{ inputs.slug }}'
          version='${{ inputs.version }}'
          mkdir -p "dist/stage/$slug"
          # 公开仓库可以有用户说明 README；安装包只复制运行白名单，
          # 避免发布辅助文件、缓存和后续新增的仓库文档混入运行包。
          for entry in SKILL.md agents references scripts assets; do
            if [[ -e "skills/$slug/$entry" ]]; then
              cp -R "skills/$slug/$entry" "dist/stage/$slug/"
            fi
          done
          (
            cd dist/stage
            zip -Xqr "../$slug-$version.zip" "$slug" \
              -x '*/.DS_Store' \
              -x '*/__pycache__/*' \
              -x '*.pyc'
          )
          (
            cd dist
            sha256sum "$slug-$version.zip" > "$slug-$version.zip.sha256"
          )
          unzip -t "dist/$slug-$version.zip"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          slug='${{ inputs.slug }}'
          version='${{ inputs.version }}'
          tag="$slug-v$version"
          gh release create "$tag" \
            "dist/$slug-$version.zip" \
            "dist/$slug-$version.zip.sha256" \
            --title "$slug $version" \
            --notes "罗老师 AI Skills 自动打包发布：$slug $version"
